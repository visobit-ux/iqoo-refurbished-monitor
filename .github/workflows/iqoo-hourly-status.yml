
name: iQOO hourly stock status

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

jobs:
  hourly-status:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          for attempt in 1 2 3; do
            if playwright install --with-deps chromium; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Chromium installation failed after 3 attempts"
              exit 1
            fi
            echo "Chromium installation attempt $attempt failed; retrying in 20 seconds..."
            sleep 20
          done

      - name: Send hourly stock report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python hourly_status.py
